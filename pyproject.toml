[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "game-telemetry-analytics-engineering"
version = "1.0.0"
description = "Reproducible synthetic game telemetry and tested analytics models"
requires-python = ">=3.11,<3.13"
dependencies = [
  "dbt-core==1.9.8", "dbt-duckdb==1.9.6", "duckdb==1.5.5",
  "jsonschema==4.25.1"
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.13.0"]

[project.scripts]
telemetry = "telemetry.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
telemetry = ["event.schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: executes dbt and rebuild/replay assertions"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
