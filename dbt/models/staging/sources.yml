version: 2
sources:
  - name: raw
    description: Canonical append-only telemetry accepted by the strict transactional loader.
    schema: raw
    tables:
      - name: events
        description: One accepted physical event per title_id and event_id. ingest_seq is the arrival watermark.
        data_tests:
          - unique_combination:
              columns: [title_id, event_id]
        columns:
          - name: ingest_seq
            data_tests: [not_null, unique]
          - name: event_id
            data_tests: [not_null]
          - name: title_id
            data_tests: [not_null]
          - name: session_id
            data_tests: [not_null]
          - name: event_ts
            data_tests: [not_null]
          - name: received_at
            data_tests: [not_null]
      - name: batches
        description: Immutable content-addressed ingestion receipts, including rejected batches.
        columns:
          - name: batch_id
            data_tests: [not_null, unique]
      - name: delivery_expectations
        description: Independent synthetic pre-loss manifest, by trusted UTC receipt date and title.
        data_tests:
          - unique_combination:
              columns: [receipt_date, title_id]
